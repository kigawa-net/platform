# exkes / main: temporary public Ingress lockdown (2026-11-18)
# Only the explicitly anonymous GET /health endpoint is exposed.
# SECURITY: The exkes-api application currently has no JWT authn/authz for /v1/**.
# Do not re-enable /, /dashboard, /v1 or WebSocket routes until exkes#35/#36
# and negative authentication/authorization E2E tests are complete.
# Related: platform#20 and merged PR #30.
# This is an Ingress-layer emergency mitigation, not an application-level fix.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exkes-main
  namespace: platform-exkes-main
  labels:
    app.kubernetes.io/part-of: exkes
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: haproxy
  rules:
    - host: exkes.kigawa.net
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: exkes-api
                port:
                  number: 8080
  tls:
    - hosts:
        - exkes.kigawa.net
      secretName: kigawa-net-wildcard-tls
