# exkes / stg: temporary public Ingress lockdown (2026-11-18)
# Only the explicitly anonymous GET /health endpoint is exposed.
# SECURITY: exkes-api lacks JWT authn/authz for /v1/**, while the
# exkes-terminal-gateway session path also requires verified protection.
# Do not re-enable /, /dashboard, /v1 or /v1/terminal until auth/authorization
# and negative WebSocket/HTTP E2E tests are complete (exkes#35/#36).
# Related: platform#20; this is a temporary Ingress-layer mitigation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exkes-stg
  namespace: platform-exkes-stg
  labels:
    app.kubernetes.io/part-of: exkes
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: haproxy
  rules:
    - host: exkes-stg.kigawa.net
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: exkes-api
                port:
                  number: 8080
  tls:
    - hosts:
        - exkes-stg.kigawa.net
      secretName: kigawa-net-wildcard-tls
