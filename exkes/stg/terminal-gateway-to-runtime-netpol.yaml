# exkes / stg: Runtime Pod への ingress を terminal gateway からだけ許可する NetworkPolicy
#
# 更新者: 手動（PR のみ）。CI はこのファイルを触らない。
#
# 対象 namespace: **platform-exkes-stg-sandbox**（= exkes/stg/sandbox-ns.yaml で作る）。
#   metadata.namespace を明示する（network-policy.yaml と同じ扱い）。
#
# 役割:
#   runtime-agent（`/terminal`）は**認証を行わない**（docs/runtime-agent-terminal.md）。
#   到達できるクライアントをすべて信頼する設計なので、ネットワークで
#   exkes-terminal-gateway の Pod からの接続だけを通す。
#   既存の default-deny（network-policy.yaml、ingress / egress とも全 deny）に対する
#   **追加許可**であり、default-deny 自体は変えない。
#
# 許可の中身:
#   - 宛先 Pod: app.kubernetes.io/managed-by=exkes のラベルを持つ Pod（controller が作る
#     Runtime Pod には runtimeSystemLabels で必ずこのラベルが付く）。
#   - 接続元: namespace platform-exkes-stg の app=exkes-terminal-gateway の Pod。
#   - ポート: TCP 8080（runtime-agent の待ち受け）のみ。
#   - egress 側は触らない（Runtime Pod の egress は default-deny のまま）。
#
# 注意（docs/terminal-gateway.md の案からの差分）:
#   案では宛先 Pod を `exkes.runtime: "true"` で選んでいたが、controller は
#   そのラベルを付けていない（付いているのは app.kubernetes.io/managed-by と
#   exkes.runtime-id）。案のままだと許可が 1 件も効かず、terminal が
#   全て失敗する。実装に合わせて managed-by で選ぶ。
#
# 接続元 Pod の namespace は kubernetes.io/metadata.name（Kubernetes が自動で付ける
# ラベル）で選ぶ。control namespace には NetworkPolicy を作らない方針
# （network-policy.yaml 冒頭）のため、gateway 側の egress はここでは絞らない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-terminal-gateway-to-runtime
  namespace: platform-exkes-stg-sandbox
  labels:
    app.kubernetes.io/part-of: exkes
    app.kubernetes.io/instance: exkes-stg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: exkes
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-exkes-stg
          podSelector:
            matchLabels:
              app: exkes-terminal-gateway
      ports:
        - protocol: TCP
          port: 8080
