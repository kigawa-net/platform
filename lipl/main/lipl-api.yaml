apiVersion: apps/v1
kind: Deployment
metadata:
  name: lipl-api
  labels:
    app: lipl-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lipl-api
  template:
    metadata:
      name: lipl-api
      labels:
        app: lipl-api
    spec:
      imagePullSecrets:
        - name: harbor-registry
      # レプリカが同一ノードに集中して単一ノード障害でも全滅しないよう、
      # 別ノードに分散させることを優先する（必須にはしない＝空きがなければ同居も許容）。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: lipl-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: lipl-api
          image: harbor.kigawa.net/private/lipl-api:main-16d0be40d44b6e7190b031ca44c33f32db3563ae
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: mariadb-lipl-main
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: lipl
            - name: DB_USER
              value: lipl
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-lipl-main
                  key: pass
            # replicas:2（ロールアウト中は最大3）× このプールサイズが、DBユーザーの
            # max_user_connections（20）を超えないようにする。3×6=18。
            - name: DB_POOL_SIZE
              value: "6"
            - name: KEYCLOAK_ISSUER
              value: https://user.kigawa.net/realms/lipl
            - name: KAFT_BASE_URL
              value: http://kaft.kaft-main.svc.cluster.local:8080
            - name: KAFT_PUBLIC_BASE_URL
              value: https://kaft.kigawa.net
            - name: KAFT_INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaft-main
                  key: internal-jwt-secret
            - name: ANTHROPIC_KEYCLOAK_CLIENT_ID
              value: lipl-api-service
            - name: ANTHROPIC_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lipl-api-service-keycloak
                  key: client-secret
            - name: ANTHROPIC_FEDERATION_RULE_ID
              value: fdrl_01BfKKM3JkCkzHsP7mNNAhYm
            - name: ANTHROPIC_ORGANIZATION_ID
              value: e1c1d300-e0a4-440c-badb-98548fdf42dc
            - name: ANTHROPIC_SERVICE_ACCOUNT_ID
              value: svac_01S4bFpcpBZkg2fLR9M7QTEq
            # ログイン永続化（BFF方式）用。ユーザー認証はlipl-api-serviceとは別のconfidential
            # クライアント（lipl-backend）を使う。
            - name: KEYCLOAK_BACKEND_CLIENT_ID
              value: lipl-backend
            - name: KEYCLOAK_BACKEND_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lipl-backend-keycloak
                  key: client-secret
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lipl-session-encryption-key
                  key: value
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: lipl-api
spec:
  selector:
    app: lipl-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
