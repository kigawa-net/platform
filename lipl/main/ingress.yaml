apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lipl
spec:
  ingressClassName: haproxy
  rules:
    - host: lipl.kigawa.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lipl-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lipl-frontend
                port:
                  number: 3000
# 店舗LP（<slug>-lipl.kigawa.net）向けの動的ホストルーティングは、
# HAProxy Ingress Controllerでの検証待ちのため未実装（docs/infrastructure.md「未確定・要確認事項」参照）。
# 該当機能（店舗管理・公開LP）のバックエンド実装が完了した時点で追加する。
