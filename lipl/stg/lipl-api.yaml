apiVersion: apps/v1
kind: Deployment
metadata:
  name: lipl-api
  labels:
    app: lipl-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lipl-api
  template:
    metadata:
      name: lipl-api
      labels:
        app: lipl-api
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: lipl-api
          image: harbor.kigawa.net/private/lipl-api:main-b182b8c8fb3ee28c596d3bc30792ce8f47704ba5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: lipl-api
spec:
  selector:
    app: lipl-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
