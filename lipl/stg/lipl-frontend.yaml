apiVersion: apps/v1
kind: Deployment
metadata:
  name: lipl-frontend
  labels:
    app: lipl-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lipl-frontend
  template:
    metadata:
      name: lipl-frontend
      labels:
        app: lipl-frontend
    spec:
      imagePullSecrets:
        - name: harbor-registry
      containers:
        - name: lipl-frontend
          image: harbor.kigawa.net/private/lipl-frontend:main-e02079a20edf17d467ad1011bad7d3c6488c94ec
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: lipl-frontend
spec:
  selector:
    app: lipl-frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
